name: Feature request
description: Suggest a new command, layout, setting or behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or problem first, then the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and prior art
      description: How do other tilers (Krohnkite, Polonium, i3, bspwm, niri, ...) or KWin itself handle this?
