# Plastile continuous integration (task T33, hosted-runner part).
#
# What CI can and cannot do (see docs/status/CI.md):
#   - It runs the pure/replay TypeScript tests, the type check, the bundle build,
#     the documentation integrity check, the release-zip reproducibility check and
#     the native test-tool builds.
#   - The integration-nested job runs the nested-KWin scenarios against real
#     kwin_wayland 6.7.5 (Ubuntu 26.10 packages) inside a disposable chroot built by
#     tools/sandbox/create.sh: virtual backend, private D-Bus, QPainter compositing.
#     Scenarios needing a capability the runner lacks report SKIP by ID.
#   - It CANNOT run physical-session checks (real outputs, input-to-photon latency);
#     those are reported as NOT RUN, never as passed.
#
# Nothing here publishes, installs into a home directory, or touches a compositor.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The TypeScript tests run directly with `node --test tests/core/*.test.ts`, which
  # relies on Node's built-in type stripping (no tsx/ts-node; no dependency is added).
  # package.json declares engines.node >= 26 and @types/node 26. actions/setup-node
  # resolves "26" from the nodejs.org release index (v26.12.0 listed 2026-10-14).
  NODE_MAJOR: "26"
  # The integration tooling and docs checker are developed on Python 3.14; pin it
  # instead of relying on the image's system Python (3.12 on Ubuntu 24.04).
  PYTHON_VERSION: "3.14"

jobs:
  core:
    name: Core (typecheck, tests, bundle, docs, fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Node major version
        # Guard against a silently older toolchain producing a misleading result.
        run: |
          node --version
          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" -lt "$NODE_MAJOR" ]; then
            echo "::error::Node $major found; the test suite requires Node >= $NODE_MAJOR" >&2
            exit 1
          fi
          python3 --version

      - name: Install dependencies (npm ci)
        # npm 11 does not run esbuild's postinstall script by default; esbuild still
        # works through its platform optional dependency (@esbuild/linux-x64).
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Pure and replay tests (tests/core)
        run: npm test

      - name: Build the KWin script bundle
        run: npm run build

      - name: Verify bundle output
        run: |
          test -s package/contents/code/plastile.mjs
          wc -c package/contents/code/plastile.mjs
          # The bundle targets ES2016 for KWin's QV4. This is a cheap syntax sanity
          # guard, not a QV4 run: warn if a few known-rejected constructs leak through.
          if grep -vE '^\s*//' package/contents/code/plastile.mjs | grep -qE '^\s*(async |#|static \w+ =)'; then
            grep -nE '^\s*(async |#|static \w+ =)' package/contents/code/plastile.mjs | head
            echo "::warning::possible QV4-incompatible syntax in bundle (see M0 probe report)"
          fi

      - name: Documentation integrity (links, source pins, backlog)
        run: python3 tools/check_docs.py

      - name: Release package is reproducible (tools/release.py --check)
        # Builds dist/plastile-<version>.kwinscript twice and compares bytes. It does
        # not install anything (installation is exercised only in nested sessions).
        if: hashFiles('tools/release.py') != ''
        run: python3 tools/release.py --check --out dist

      - name: Integration scenario registry imports (no KWin is started)
        # Imports tests/integration/scenarios*.py through run.py --list. This only
        # proves the scenario modules import and register; it does not run them.
        run: |
          python3 tests/integration/run.py --list | tee scenarios.txt
          n="$(grep -c . scenarios.txt)"
          echo "integration scenarios registered: $n (NOT RUN in CI: needs nested KWin)"
          test "$n" -gt 0
          echo "SCENARIO_COUNT=$n" >> "$GITHUB_ENV"

      - name: Install native build dependencies (Wayland and X11 fixture clients)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-icccm4-dev

      - name: Build fixtures/client (plastile-fixture)
        # Raw libwayland client (xdg-shell, presentation-time, xdg-decoration,
        # vendored wlr-layer-shell); -Wall -Wextra -Werror. Built only, never run:
        # running it needs a Wayland compositor.
        run: |
          make -C fixtures/client
          test -x fixtures/client/build/plastile-fixture

      - name: Build fixtures/xclient (plastile-xclient)
        # X11 (xcb) client for XWayland scenarios. Built only, never run.
        if: hashFiles('fixtures/xclient/Makefile') != ''
        run: |
          make -C fixtures/xclient
          test -x fixtures/xclient/build/plastile-xclient

      - name: Install libei (input injector)
        id: libei_install
        # Ubuntu 24.04 (ubuntu-latest) ships libei-dev 1.2.1; the injector is developed
        # against libei 1.6.0. It built and linked against 1.2.1 on the runner
        # (run 39087511435, 2026-10-18), so the step is required.
        run: |
          sudo apt-get install -y --no-install-recommends libei-dev
          pkg-config --modversion libei-1.0

      - name: Build tools/input (plastile-input)
        id: input_build
        run: |
          make -C tools/input
          test -x build/input/plastile-input

      - name: Physical-session kit (tools/physical) unit tests and build
        # Offline tests only (synthetic and recorded fixture logs). The live tools
        # refuse to run outside a real Plasma Wayland session.
        run: |
          python3 -m unittest discover -s tools/physical/tests -v
          make -C tools/physical

      - name: Job summary
        if: always()
        # T33 acceptance: CI may not pass by skipping mandatory tests unnoticed.
        # Every optional step and every layer CI cannot run is listed explicitly.
        run: |
          {
            echo "## Plastile CI: core job"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Node ${NODE_MAJOR} type check, tests/core (pure + replay), bundle, docs check, release --check, fixture builds | required: job status ${{ job.status }} |"
            echo "| libei-dev install + tools/input build | ${{ steps.input_build.outcome }} |"
            echo "| Nested KWin integration scenarios (${SCENARIO_COUNT:-?} registered here) | run by the integration-nested job |"
            echo "| Physical-session checks | **NOT RUN**: requires a live Plasma Wayland desktop |"
            echo
            echo "See docs/status/CI.md for the TEST_MATRIX coverage split."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle, release zip and fixture binaries
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: plastile-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            package/contents/code/plastile.mjs
            dist/*.kwinscript
            fixtures/client/build/plastile-fixture
            fixtures/xclient/build/plastile-xclient
            build/input/plastile-input

  native-tools:
    # Measurement-only and settings-check helpers (never shipped in the package).
    # tools/measure needs Qt >= 6.5 (qt_standard_project_setup REQUIRES 6.5) and
    # tools/settings-check needs Qt6 UiTools plus KF6Config/KF6ConfigWidgets.
    # Ubuntu 24.04 (ubuntu-latest) has Qt 6.4.2 and no KF6 packages, so this job uses
    # the ubuntu-26.04 image (label listed in actions/runner-images; Qt 6.10, KF 6.24).
    # Seen green on the runner (run 39087511435, 2026-10-18), so the job is required.
    name: Native test tools (Qt6/KF6)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 / KF6 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev \
            libkf6config-dev libkf6configwidgets-dev

      - name: Build tools/measure (Plastile.Measure QML module)
        run: |
          cmake -S tools/measure -B build/measure -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/measure
          ls -R build/measure/qml

      - name: Build tools/settings-check
        run: |
          cmake -S tools/settings-check -B build/settings-check -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/settings-check
          test -x build/settings-check/plastile-settings-check

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Plastile CI: native test tools"
            echo
            echo "Status: ${{ job.status }}. The settings-check binary is only built, not run"
            echo "(it needs a display)."
          } >> "$GITHUB_STEP_SUMMARY"

  integration-nested:
    # Nested KWin layer (TEST_MATRIX "Nested compositor integration"). Real
    # kwin_wayland from Ubuntu 26.10 packages in a disposable chroot created by the
    # committed tools/sandbox/create.sh (same scripts as local runs), virtual backend,
    # private D-Bus, no GPU (QPainter compositing). Not a physical-session result.
    name: Nested KWin integration (Ubuntu 26.10 sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          # package-upgrade-bindings-T26-T32 builds the older package from a past commit.
          fetch-depth: 0

      - name: Create the KWin sandbox (debootstrap Ubuntu 26.10)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap
          sudo PLASTILE_SANDBOX_APPS=0 tools/sandbox/create.sh /opt/plastile-kwin-sandbox stonking

      - name: Build inside the sandbox (npm ci, bundle, fixtures, input injector)
        run: |
          sudo tools/sandbox/run.sh -- bash -euc '
            npm ci
            npm run build
            make -C fixtures/client
            make -C fixtures/xclient
            make -C tools/input
          '

      - name: Run nested integration scenarios
        run: |
          # Expected SKIPs only (any other SKIP fails the job): QPainter compositing cannot run the GL
          # tile-editor effect, KWin normalizes output origins so a negative origin cannot occur, and the
          # sandbox image has no plasmashell or kcmshell6 (the real-panel and settings-dialog scenarios run on
          # the reference host).
          sudo tools/sandbox/run.sh -- python3 tests/integration/run.py --markdown artifacts/integration-summary.md \
            --expect-skips native-editor-toggle-L14,output-negative-origin-G02,plasmashell-panels-O07,settings-dialog-T28

      - name: Job summary
        if: always()
        run: |
          if [ -f artifacts/integration-summary.md ]; then
            cat artifacts/integration-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nested integration did not produce a summary (setup failed)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload integration reports and KWin logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nested-integration-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/integration/**/report.json
            artifacts/integration/**/kwin.log
            artifacts/integration-summary.md

  integration-nested-kwin68:
    # Second KWin API family: KWin 6.8.0 from the pinned Nix environment in
    # tools/sandbox/nix (OpenGL via llvmpipe behind an emulated /dev/udmabuf, see its
    # README). Same suite as integration-nested. continue-on-error until it has been
    # seen green on a hosted runner (it passes locally: tools/sandbox/nix/README.md);
    # the outcome is always written to the job summary.
    name: Nested KWin 6.8 integration (Nix, provisional)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # package-upgrade-bindings-T26-T32 builds the older package from a past commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: npm

      - name: Install Nix (single-user, no daemon)
        run: |
          sh <(curl -fsSL https://releases.nixos.org/nix/nix-2.33.0/install) --no-daemon --yes
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build the bundle and fixture clients on the host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libwayland-dev wayland-protocols libxcb1-dev libxcb-icccm4-dev libei-dev
          npm ci
          npm run build
          make -C fixtures/client
          make -C fixtures/xclient
          make -C tools/input
          sudo install -d -m 1777 /tmp/.X11-unix

      - name: Run nested integration scenarios (KWin 6.8)
        run: |
          tools/sandbox/nix/run.sh -- kwin_wayland --version
          # llvmpipe runs the tile-editor effect here; the expected SKIPs are the negative origin, the
          # real-panel scenario and the settings dialog (the Nix environment has no plasmashell or kcmshell6).
          tools/sandbox/nix/run.sh -- python3 tests/integration/run.py --markdown artifacts/integration-kwin68-summary.md \
            --expect-skips output-negative-origin-G02,plasmashell-panels-O07,settings-dialog-T28

      - name: Diagnostics on failure (device nodes, first KWin log)
        if: failure()
        run: |
          ls -l /dev/dri /dev/udmabuf 2>&1 || true
          id
          f=$(find artifacts/integration -name kwin.log | head -1)
          [ -n "$f" ] && head -60 "$f" || echo "no kwin.log"

      - name: Job summary
        if: always()
        run: |
          echo "Provisional job (continue-on-error); status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/integration-kwin68-summary.md ]; then
            cat artifacts/integration-kwin68-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload integration reports and KWin logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nested-integration-kwin68-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/integration/**/report.json
            artifacts/integration/**/kwin.log
            artifacts/integration-kwin68-summary.md
